name: release-check

on:
  push:
  pull_request:

jobs:
  offline-contract:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Shell syntax
        run: |
          bash -n setup.sh
          bash -n run.sh
          bash -n stop.sh
          bash -n doctor.sh
          bash -n test.sh
          bash -n scripts/*.sh

      - name: Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          roots = (
              Path("h3serve"),
              Path("scripts"),
              Path("integrations"),
          )

          files = [
              path
              for root in roots
              if root.exists()
              for path in root.rglob("*.py")
          ]

          for path in files:
              ast.parse(
                  path.read_text(encoding="utf-8"),
                  filename=str(path),
              )

          print(f"Parsed {len(files)} Python files")
          PY
