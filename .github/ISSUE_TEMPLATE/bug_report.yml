name: Bug report
description: Report a reproducible installation, runtime, API, UI or ComfyUI problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private prompts or private reference media.
  - type: input
    id: version
    attributes:
      label: X-MinimaxH3 version
      placeholder: 0.7.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Ubuntu 22.04
        - Windows 11 + WSL2 Ubuntu 22.04
        - Other Linux x86_64
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Paste scripts/doctor.py output after removing private paths or secrets.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact credentials and private media/prompt content.
      render: shell
